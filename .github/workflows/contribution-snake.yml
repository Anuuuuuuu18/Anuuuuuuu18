name: Generate pink contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the pink contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Anuuuuuuu18
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d94f91&color_dots=#fff5fa,#f7c5dd,#ef96c6,#df63a6,#b8337c

      - name: Publish the animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
